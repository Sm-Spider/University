<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест продуктивності 3D-моделей</title>
<style>
  :root {
    --bg: #0f1624;
    --panel: rgba(16, 26, 43, 0.92);
    --line: #2b3b55;
    --text: #f1f3f6;
    --muted: #a8b3c4;
    --accent: #f2994a;
    --ok: #6fcf97;
    --err: #ff8a80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .panel { position: fixed; left: 8px; right: 8px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; backdrop-filter: blur(6px); }
  #controls { top: 8px; max-height: 62vh; overflow: auto; max-width: 560px; }
  #hud { bottom: 8px; max-width: 560px; font-variant-numeric: tabular-nums; }
  #results { top: 8px; bottom: 8px; max-width: 900px; overflow: auto; display: none; }
  body.show-results #results { display: block; }
  body.show-results #controls, body.show-results #hud { display: none; }
  body.testing #controls { display: none; }

  h1 { font-size: 18px; margin: 0 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; align-items: center; }
  label { color: var(--muted); font-size: 14px; display: flex; gap: 6px; align-items: center; }
  select, input[type=text], button { font: inherit; color: var(--text); background: #182438;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 44px; }
  input[type=text] { width: 150px; }
  button { cursor: pointer; font-weight: 600; }
  button.primary { background: var(--accent); color: #101a2b; border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  input[type=checkbox] { width: 20px; height: 20px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: #182438; border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 13px; }
  #status { margin: 8px 0 0; font-size: 15px; min-height: 22px; }
  #status.err { color: var(--err); }
  #status.ok { color: var(--ok); }
  #info { margin: 6px 0 0; color: var(--muted); font-size: 12px; word-break: break-word; }

  table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  .scroll { overflow-x: auto; }
  #tsv { display: none; width: 100%; height: 120px; margin-top: 8px; background: #182438; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 12px/1.3 monospace; }
  #fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
    text-align: center; background: var(--bg); z-index: 10; }
  @media (max-width: 480px) { .stat b { font-size: 18px; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="fatal"><p id="fatalText"></p></div>

<div id="controls" class="panel">
  <h1>Тест продуктивності 3D-моделей</h1>
  <div class="row">
    <select id="model" aria-label="Модель"></select>
    <button id="btnLoad" class="primary">Завантажити</button>
  </div>
  <div class="row">
    <label>Пристрій <input id="device" type="text" maxlength="30"></label>
    <label>Тривалість
      <select id="dur">
        <option value="15">15 с</option>
        <option value="30" selected>30 с</option>
        <option value="60">60 с</option>
      </select>
    </label>
    <button id="btnTest" disabled>Запустити тест</button>
  </div>
  <div class="row">
    <label>Pixel ratio
      <select id="pr">
        <option value="1" selected>1 (рекомендовано)</option>
        <option value="native">рідний</option>
      </select>
    </label>
    <label><input id="flat" type="checkbox" checked> Однаковий матеріал</label>
    <label><input id="comma" type="checkbox" checked> Десяткова кома</label>
  </div>
  <div class="row">
    <button id="btnResults">Результати</button>
  </div>
  <p id="status">Обери модель і натисни «Завантажити».</p>
</div>

<div id="hud" class="panel">
  <div class="stats">
    <div class="stat"><b id="vFps">–</b><span>FPS</span></div>
    <div class="stat"><b id="vMs">–</b><span>мс / кадр</span></div>
    <div class="stat"><b id="vTris">–</b><span>трикутників</span></div>
    <div class="stat"><b id="vLoad">–</b><span>завантаження, мс</span></div>
    <div class="stat"><b id="vSize">–</b><span>файл, МБ</span></div>
    <div class="stat"><b id="vHz">–</b><span>частота екрана, Гц</span></div>
  </div>
  <p id="info"></p>
</div>

<div id="results" class="panel">
  <div class="row">
    <button id="btnBack">← Назад</button>
    <button id="btnCopy" class="primary">Копіювати для таблиці</button>
    <button id="btnUndo">Видалити останній</button>
    <button id="btnClear">Очистити все</button>
  </div>
  <div class="scroll">
    <table>
      <thead>
        <tr><th>Пристрій</th><th>Модель</th><th>Трикутників</th><th>МБ</th><th>Завант., мс</th>
            <th>FPS</th><th>мс/кадр</th><th>1% low FPS</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <textarea id="tsv" readonly></textarea>
</div>

<script type="module">
/* ====== НАЛАШТУВАННЯ ====== */
// Файли моделей лежать у папці models/ поруч з index.html.
const MODELS = [
  { label: 'V1 · ~10 тис.',  file: 'models/v1.glb' },
  { label: 'V2 · ~50 тис.',  file: 'models/v2.glb' },
  { label: 'V3 · ~100 тис.', file: 'models/v3.glb' },
  { label: 'V4 · ~250 тис.', file: 'models/v4.glb' },
  { label: 'V5 · ~500 тис.', file: 'models/v5.glb' },
  { label: 'V6 · ~1 млн',    file: 'models/v6.glb' },
];
const WARMUP_S = 3;            // прогрів перед записом, с
const ROTATION_SPEED = 0.0005; // рад/мс (0.5 рад/с): модель обертається однаково на всіх пристроях
const STORAGE_ROWS = 'm3dtest.rows.v1';
const STORAGE_DEVICE = 'm3dtest.device.v1';
/* ========================== */

const $ = (id) => document.getElementById(id);

function showFatal(msg) {
  $('fatalText').textContent = msg;
  $('fatal').style.display = 'flex';
}

let THREE, GLTFLoader;
try {
  THREE = await import('three');
  ({ GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js'));
} catch (e) {
  showFatal('Не вдалося завантажити Three.js із CDN. Перевір інтернет або змінь версію в importmap. ' + e.message);
  throw e;
}

/* ---------- збереження (з захистом від помилок) ---------- */
function lsGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
  catch { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* ігноруємо */ }
}

/* ---------- сцена ---------- */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1624);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 0.6, 4.2);
camera.lookAt(0, 0, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.position.set(3, 5, 4);
scene.add(sun);

const flatMat = new THREE.MeshStandardMaterial({ color: 0xb8c4d6, roughness: 0.6, metalness: 0.1 });
const loader = new GLTFLoader();

let gpuName = 'невідомо';
try {
  const gl = renderer.getContext();
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  if (ext) gpuName = String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL));
} catch { /* ігноруємо */ }

function applySize() {
  const pr = $('pr').value === 'native' ? window.devicePixelRatio : 1;
  renderer.setPixelRatio(pr);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  updateInfo();
}
window.addEventListener('resize', applySize);
$('pr').addEventListener('change', applySize);

/* ---------- стан ---------- */
let pivot = null;                // група з поточною моделлю
let current = null;              // метадані завантаженої моделі
let refreshHz = 0;
let busy = false;
let test = null;
let wakeLock = null;

function setStatus(text, kind = '') {
  const el = $('status');
  el.textContent = text;
  el.className = kind;
}

function updateInfo() {
  const w = renderer.domElement.width, h = renderer.domElement.height;
  $('info').textContent = `Three.js r${THREE.REVISION} · GPU: ${gpuName} · canvas ${w}×${h}`;
}

/* ---------- модель ---------- */
function disposeMaterial(m) {
  if (!m || m === flatMat) return;
  (Array.isArray(m) ? m : [m]).forEach((x) => x && x.dispose && x.dispose());
}

function clearModel() {
  if (!pivot) return;
  scene.remove(pivot);
  pivot.traverse((o) => {
    if (o.isMesh) {
      if (o.geometry && o.geometry.dispose) o.geometry.dispose();
      disposeMaterial(o.material);
    }
  });
  pivot = null;
  current = null;
}

function countTriangles(root) {
  let n = 0;
  root.traverse((o) => {
    if (!o.isMesh || !o.geometry) return;
    const g = o.geometry;
    n += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
  });
  return Math.round(n);
}

const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));

async function loadModel(item) {
  clearModel();
  $('btnTest').disabled = true;
  ['vTris', 'vLoad', 'vSize'].forEach((id) => { $(id).textContent = '…'; });
  setStatus('Завантаження…');

  const sep = item.file.includes('?') ? '&' : '?';
  const url = item.file + sep + 'nocache=' + Date.now();

  const t0 = performance.now();
  const resp = await fetch(url, { cache: 'no-store' });
  if (!resp.ok) throw new Error('HTTP ' + resp.status + ' для ' + item.file);
  const buf = await resp.arrayBuffer();
  const t1 = performance.now();

  const gltf = await loader.parseAsync(buf, '');
  const t2 = performance.now();

  const root = gltf.scene;
  const useFlat = $('flat').checked;
  root.traverse((o) => {
    if (o.isMesh && useFlat) {
      disposeMaterial(o.material);
      o.material = flatMat;
    }
  });

  const box = new THREE.Box3().setFromObject(root);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);
  root.position.sub(center);
  const group = new THREE.Group();
  group.add(root);
  group.scale.setScalar(2 / (Math.max(size.x, size.y, size.z) || 1));
  scene.add(group);
  pivot = group;

  renderer.render(scene, camera);
  await nextFrame();
  const t3 = performance.now();

  current = {
    label: item.label,
    tris: countTriangles(root),
    sizeMb: buf.byteLength / (1024 * 1024),
    downloadMs: t1 - t0,
    parseMs: t2 - t1,
    loadMs: t3 - t0,
  };
  $('vTris').textContent = current.tris.toLocaleString('uk-UA');
  $('vLoad').textContent = Math.round(current.loadMs).toLocaleString('uk-UA');
  $('vSize').textContent = current.sizeMb.toFixed(1);
  $('btnTest').disabled = false;
  setStatus(`Готово: ${current.tris.toLocaleString('uk-UA')} трикутників. Можна запускати тест.`, 'ok');
}

/* ---------- цикл рендеру і вимірювання ---------- */
let last = performance.now();
let hudT = last, hudFrames = 0, hudSum = 0;
let baseline = [];
let shownSecond = -1;

const STD_HZ = [30, 48, 50, 60, 72, 75, 90, 100, 120, 144, 165, 240];

function estimateHz(deltas) {
  const s = deltas.slice(10).sort((a, b) => a - b);
  if (!s.length) return 0;
  const raw = 1000 / s[Math.floor(s.length / 2)];
  return STD_HZ.reduce((best, v) => (Math.abs(v - raw) < Math.abs(best - raw) ? v : best), STD_HZ[0]);
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = now - last;
  last = now;
  if (dt <= 0) return;

  if (pivot) pivot.rotation.y += dt * ROTATION_SPEED;
  renderer.render(scene, camera);

  hudFrames++;
  hudSum += dt;
  if (now - hudT >= 500) {
    $('vFps').textContent = Math.round((hudFrames * 1000) / hudSum);
    $('vMs').textContent = (hudSum / hudFrames).toFixed(1);
    hudFrames = 0; hudSum = 0; hudT = now;
  }

  if (test) {
    stepTest(now, dt);
  } else if (!refreshHz && !pivot) {
    baseline.push(dt);
    if (baseline.length >= 90) {
      refreshHz = estimateHz(baseline);
      $('vHz').textContent = refreshHz || '–';
    }
  }
}
requestAnimationFrame(frame);

/* ---------- тест ---------- */
async function lockScreen() {
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch { /* ігноруємо */ }
}
function unlockScreen() {
  try { if (wakeLock) wakeLock.release(); } catch { /* ігноруємо */ }
  wakeLock = null;
}

function startTest() {
  if (!pivot || !current || test || busy) return;
  test = { phase: 'warmup', t0: performance.now(), t1: 0, dur: Number($('dur').value), deltas: [] };
  shownSecond = -1;
  document.body.classList.add('testing');
  $('btnLoad').disabled = true;
  lockScreen();
}

function endTestUi() {
  test = null;
  unlockScreen();
  document.body.classList.remove('testing');
  $('btnLoad').disabled = false;
}

function abortTest(msg) {
  endTestUi();
  setStatus(msg, 'err');
}

function stepTest(now, dt) {
  if (document.hidden) { abortTest('Вкладку було згорнуто: тест скасовано. Повтори, не перемикаючи вкладки.'); return; }
  if (test.phase === 'warmup') {
    const left = WARMUP_S - (now - test.t0) / 1000;
    if (left <= 0) { test.phase = 'record'; test.t1 = now; return; }
    const sec = Math.ceil(left);
    if (sec !== shownSecond) { shownSecond = sec; setStatus(`Прогрів… ${sec} с`); }
    return;
  }
  test.deltas.push(dt);
  const el = (now - test.t1) / 1000;
  const sec = Math.floor(el);
  if (sec !== shownSecond) { shownSecond = sec; setStatus(`Запис ${sec} / ${test.dur} с`); }
  if (el >= test.dur) finishTest();
}

function finishTest() {
  const d = test.deltas;
  const n = d.length;
  const total = d.reduce((a, b) => a + b, 0);
  const avgMs = total / n;
  const sorted = d.slice().sort((a, b) => b - a);
  const p99 = sorted[Math.max(0, Math.ceil(n * 0.01) - 1)];
  const device = $('device').value.trim() || 'Пристрій';

  const rows = lsGet(STORAGE_ROWS, []);
  const run = rows.filter((r) => r.device === device && r.model === current.label).length + 1;
  rows.push({
    device,
    model: current.label,
    run,
    tris: current.tris,
    sizeMb: current.sizeMb,
    loadMs: current.loadMs,
    downloadMs: current.downloadMs,
    parseMs: current.parseMs,
    fps: 1000 / avgMs,
    ms: avgMs,
    low1: 1000 / p99,
    hz: refreshHz,
    pr: renderer.getPixelRatio(),
    canvas: `${renderer.domElement.width}x${renderer.domElement.height}`,
    gpu: gpuName.replace(/[\t\r\n]+/g, ' '),
    dur: test.dur,
    frames: n,
  });
  lsSet(STORAGE_ROWS, rows);
  endTestUi();
  renderRows();
  setStatus(`Готово: ${(1000 / avgMs).toFixed(1)} FPS, ${avgMs.toFixed(2)} мс/кадр (прогін №${run}). Результат збережено.`, 'ok');
}

/* ---------- результати ---------- */
function fmt(value, digits) {
  const s = Number(value).toFixed(digits);
  return $('comma').checked ? s.replace('.', ',') : s;
}

function renderRows() {
  const rows = lsGet(STORAGE_ROWS, []);
  const body = $('rows');
  body.textContent = '';
  rows.forEach((r) => {
    const tr = document.createElement('tr');
    [r.device, `${r.model} (#${r.run})`, r.tris, fmt(r.sizeMb, 1), Math.round(r.loadMs),
      fmt(r.fps, 1), fmt(r.ms, 2), fmt(r.low1, 1)].forEach((v) => {
      const td = document.createElement('td');
      td.textContent = String(v);
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

function toTSV() {
  const rows = lsGet(STORAGE_ROWS, []);
  const head = ['device', 'model', 'run', 'triangles', 'file_mb', 'load_total_ms', 'download_ms', 'parse_ms',
    'fps_avg', 'frame_ms_avg', 'fps_1pct_low', 'refresh_hz', 'pixel_ratio', 'canvas', 'gpu', 'duration_s', 'frames'];
  const lines = [head.join('\t')];
  rows.forEach((r) => {
    lines.push([r.device, r.model, r.run, r.tris, fmt(r.sizeMb, 2), Math.round(r.loadMs), Math.round(r.downloadMs),
      Math.round(r.parseMs), fmt(r.fps, 2), fmt(r.ms, 3), fmt(r.low1, 2), r.hz, r.pr, r.canvas, r.gpu, r.dur, r.frames]
      .join('\t'));
  });
  return lines.join('\n');
}

async function copyTable() {
  const text = toTSV();
  try {
    await navigator.clipboard.writeText(text);
    $('tsv').style.display = 'none';
    setStatus('Таблицю скопійовано. Встав її в Google Sheets або Excel.', 'ok');
  } catch {
    const ta = $('tsv');
    ta.value = text;
    ta.style.display = 'block';
    ta.focus();
    ta.select();
    setStatus('Текст виділено нижче: скопіюй його вручну.');
  }
}

/* ---------- події ---------- */
MODELS.forEach((m, i) => {
  const o = document.createElement('option');
  o.value = String(i);
  o.textContent = m.label;
  $('model').appendChild(o);
});

const guessDevice = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Смартфон' : 'Ноутбук';
$('device').value = lsGet(STORAGE_DEVICE, guessDevice);
$('device').addEventListener('change', () => lsSet(STORAGE_DEVICE, $('device').value.trim()));

$('btnLoad').addEventListener('click', async () => {
  if (busy || test) return;
  busy = true;
  $('btnLoad').disabled = true;
  try {
    await loadModel(MODELS[Number($('model').value)]);
  } catch (e) {
    let msg = 'Помилка: ' + (e && e.message ? e.message : e);
    if (/draco|meshopt|ktx/i.test(msg)) msg += '. Експортуй GLB без стиснення (Draco/Meshopt).';
    setStatus(msg, 'err');
    ['vTris', 'vLoad', 'vSize'].forEach((id) => { $(id).textContent = '–'; });
  } finally {
    busy = false;
    $('btnLoad').disabled = false;
  }
});

$('btnTest').addEventListener('click', startTest);
$('btnResults').addEventListener('click', () => { renderRows(); document.body.classList.add('show-results'); });
$('btnBack').addEventListener('click', () => document.body.classList.remove('show-results'));
$('btnCopy').addEventListener('click', copyTable);
$('comma').addEventListener('change', renderRows);
$('btnUndo').addEventListener('click', () => {
  const rows = lsGet(STORAGE_ROWS, []);
  rows.pop();
  lsSet(STORAGE_ROWS, rows);
  renderRows();
});
$('btnClear').addEventListener('click', () => {
  if (window.confirm('Видалити всі результати на цьому пристрої?')) { lsSet(STORAGE_ROWS, []); renderRows(); }
});

applySize();
renderRows();
</script>
</body>
</html>
